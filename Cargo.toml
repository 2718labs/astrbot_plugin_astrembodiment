[workspace]
resolver = "2"
members = [
  "crates/ae-fixed",
  "crates/ae-contracts",
  "crates/ae-authority",
  "crates/ae-attention",
  "crates/ae-neurofield",
  "crates/ae-mechanics",
  "crates/ae-renorm",
  "crates/ae-agent",
  "crates/ae-continuum",
  "crates/ae-store",
  "crates/ae-context-projector",
  "crates/ae-runtime",
  "crates/ae-pyo3",
  "crates/ae-cognitive-envelope",
  "crates/ae-genesis",
  "crates/ae-action-contract",
  "crates/ae-efference-copy",
  "crates/ae-subjective-present",
  "crates/ae-soma",
  "crates/ae-epistemic-state",
  "crates/ae-organism-runtime",
  "crates/ae-morph",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["2718labs"]
repository = "https://github.com/2718labs/astrbot_plugin_astrembodiment"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
blake3 = "1"
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["std"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
pyo3 = { version = "0.29.0", features = ["abi3-py312"] }
getrandom = "0.3.4"
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "alloc"] }
base64 = "=0.22.1"
zeroize = "=1.8.1"
ae-fixed = { path = "crates/ae-fixed" }
ae-contracts = { path = "crates/ae-contracts" }
ae-genesis = { path = "crates/ae-genesis" }
ae-authority = { path = "crates/ae-authority" }
ae-attention = { path = "crates/ae-attention" }
ae-neurofield = { path = "crates/ae-neurofield" }
ae-mechanics = { path = "crates/ae-mechanics" }
ae-renorm = { path = "crates/ae-renorm" }
ae-agent = { path = "crates/ae-agent" }
ae-continuum = { path = "crates/ae-continuum" }
ae-store = { path = "crates/ae-store" }
ae-context-projector = { path = "crates/ae-context-projector" }
ae-runtime = { path = "crates/ae-runtime" }
ae-cognitive-envelope = { path = "crates/ae-cognitive-envelope" }
ae-action-contract = { path = "crates/ae-action-contract" }
ae-efference-copy = { path = "crates/ae-efference-copy" }
ae-subjective-present = { path = "crates/ae-subjective-present" }
ae-soma = { path = "crates/ae-soma" }
ae-epistemic-state = { path = "crates/ae-epistemic-state" }
ae-organism-runtime = { path = "crates/ae-organism-runtime" }
ae-morph = { path = "crates/ae-morph" }
