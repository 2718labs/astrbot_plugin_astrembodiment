name: Publish production release

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full SHA of the current master merge commit to publish
        required: true
        type: string
      version:
        description: Production version declared by metadata.yaml
        required: true
        default: "1.0.0"
        type: string
      tag:
        description: Annotated production tag for that version
        required: true
        default: v1.0.0
        type: string

permissions:
  contents: read

concurrency:
  group: production-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate merged master target and version
    runs-on: ubuntu-22.04
    outputs:
      target_sha: ${{ steps.identity.outputs.target_sha }}
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Require the current master merge commit
        id: identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ inputs.version }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/master"
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch origin master --depth=1
          master_sha="$(git rev-parse origin/master)"
          test "$GITHUB_SHA" = "$master_sha"
          test "$TARGET_SHA" = "$master_sha"
          printf 'target_sha=%s\n' "$master_sha" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
      - name: Verify version, tag, and changelog coupling
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: >-
          python scripts/verify_release_contract.py
          --tag "$RELEASE_TAG" --version "$RELEASE_VERSION"
      - name: Install static release test dependencies
        run: python -m pip install --upgrade pip "pytest>=8,<10"
      - name: Run static production release contract
        run: python -m pytest -q tests/test_production_release_contract.py

  build-native:
    name: Rebuild native wheel (${{ matrix.name }})
    needs: validate-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2022
            artifact: native-wheel-windows
          - name: Linux x86_64
            runner: ubuntu-22.04
            artifact: native-wheel-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.validate-release.outputs.target_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install stable Rust and packaging tools
        run: >-
          rustup toolchain install stable --profile minimal;
          rustup default stable;
          python -m pip install --upgrade pip maturin==1.14.1
      - name: Rebuild native wheel from the target SHA
        run: python -m maturin build --release --out dist
      - name: Stage the freshly rebuilt native runtime
        run: python scripts/stage_native_runtime.py --wheel-dir dist --destination .
      - name: Smoke-test the staged native runtime
        env:
          RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
        run: >-
          python -c "import hashlib, json, os, pathlib, sys; import astrembodiment_core as core; root=pathlib.Path('astrembodiment_core'); manifest_path=root/'_bundled'/'manifest.json'; manifest=json.loads(manifest_path.read_text(encoding='utf-8')); key='win32' if sys.platform == 'win32' else 'linux' if sys.platform.startswith('linux') else None; assert key is not None; entry=manifest['platforms'][key]; binary=manifest_path.parent/entry['build_id']/entry['filename']; assert binary.is_file(); assert hashlib.sha256(binary.read_bytes()).hexdigest() == entry['build_id']; assert core.version() == os.environ['RELEASE_VERSION']; print(binary)"
      - name: Save freshly rebuilt native wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  assemble-release:
    name: Assemble deterministic cross-platform release ZIP
    needs:
      - validate-release
      - build-native
    runs-on: ubuntu-22.04
    outputs:
      archive_name: ${{ steps.package.outputs.archive_name }}
      checksum_name: ${{ steps.package.outputs.checksum_name }}
      archive_sha256: ${{ steps.package.outputs.archive_sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.validate-release.outputs.target_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install release package test dependencies
        run: python -m pip install --upgrade pip "pytest>=8,<10"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-wheel-*
          path: wheels
      - name: Recheck the release contract at the target SHA
        env:
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
        run: >-
          python scripts/verify_release_contract.py
          --tag "$RELEASE_TAG" --version "$RELEASE_VERSION"
      - name: Assemble and reproduce the allowlisted ZIP
        id: package
        env:
          RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          set -euo pipefail
          archive_name="astrbot_plugin_astrembodiment-v${RELEASE_VERSION}-win_linux_x86_64.zip"
          archive="dist/${archive_name}"
          checksum="${archive}.sha256"
          rebuilt="dist/.${archive_name}.rebuild"
          python scripts/package_plugin.py \
            --output "$archive" \
            --sha256-output "$checksum" \
            --native-wheel wheels/native-wheel-windows/*.whl \
            --native-wheel wheels/native-wheel-linux/*.whl
          python scripts/package_plugin.py \
            --output "$rebuilt" \
            --native-wheel wheels/native-wheel-windows/*.whl \
            --native-wheel wheels/native-wheel-linux/*.whl
          cmp --silent "$archive" "$rebuilt"
          sha256sum --check "$checksum"
          printf 'archive_name=%s\n' "$archive_name" >> "$GITHUB_OUTPUT"
          printf 'checksum_name=%s\n' "$(basename "$checksum")" >> "$GITHUB_OUTPUT"
          printf 'archive_sha256=%s\n' "$(sha256sum "$archive" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Run the fresh-wheel release archive contract
        env:
          ASTREMBODIMENT_FRESH_WHEELS_DIR: wheels
        run: python -m pytest -q tests/test_release_contracts.py
      - name: Save verified draft-release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: astrbot-plugin-${{ needs.validate-release.outputs.tag }}-release-assets
          path: |
            dist/${{ steps.package.outputs.archive_name }}
            dist/${{ steps.package.outputs.checksum_name }}
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Create or resume the immutable production release
    needs:
      - validate-release
      - assemble-release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.validate-release.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: astrbot-plugin-${{ needs.validate-release.outputs.tag }}-release-assets
          path: release-assets
      - name: Recheck master and the downloaded release assets
        env:
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
          TARGET_SHA: ${{ needs.validate-release.outputs.target_sha }}
          ARCHIVE_NAME: ${{ needs.assemble-release.outputs.archive_name }}
          CHECKSUM_NAME: ${{ needs.assemble-release.outputs.checksum_name }}
          EXPECTED_ARCHIVE_SHA256: ${{ needs.assemble-release.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          git fetch origin master --depth=1
          test "$(git rev-parse origin/master)" = "$TARGET_SHA"
          python scripts/verify_release_contract.py \
            --tag "$RELEASE_TAG" --version "$RELEASE_VERSION"
          archive="release-assets/${ARCHIVE_NAME}"
          checksum="release-assets/${CHECKSUM_NAME}"
          test -s "$archive"
          test -s "$checksum"
          test "$(sha256sum "$archive" | awk '{print $1}')" = "$EXPECTED_ARCHIVE_SHA256"
          (
            cd release-assets
            sha256sum --check "$CHECKSUM_NAME"
          )
      - name: Create or resume the checked draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
          TARGET_SHA: ${{ needs.validate-release.outputs.target_sha }}
        run: |
          set -euo pipefail
          tag_ref="refs/tags/${RELEASE_TAG}"
          release_json="$RUNNER_TEMP/release-api.json"
          release_error="$RUNNER_TEMP/release-api.err"
          tag_exists=false
          if git ls-remote --exit-code --tags origin "$tag_ref" >/dev/null; then
            git fetch origin "$tag_ref:$tag_ref"
            tag_exists=true
            test "$(git cat-file -t "$tag_ref")" = tag
            test "$(git rev-parse "$tag_ref^{commit}")" = "$TARGET_SHA"
          fi
          release_exists=false
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > "$release_json" 2> "$release_error"; then
            release_exists=true
          elif grep -Fq "HTTP 404" "$release_error"; then
            release_exists=false
          else
            cat "$release_error" >&2
            exit 1
          fi
          if test "$release_exists" = true; then
            test "$tag_exists" = true
            python - "$release_json" "$RELEASE_TAG" "$TARGET_SHA" <<'PY'
          import json
          import sys

          release = json.load(open(sys.argv[1], encoding="utf-8"))
          tag, target = sys.argv[2:]
          if release.get("tag_name") != tag:
              raise SystemExit("draft release tag does not match the requested tag")
          if release.get("target_commitish") != target:
              raise SystemExit("draft release target does not match the requested SHA")
          if release.get("draft") is not True:
              raise SystemExit("existing release is already published")
          if release.get("prerelease") is not False:
              raise SystemExit("existing release has an unexpected prerelease state")
          if release.get("immutable") is True:
              raise SystemExit("existing draft release is unexpectedly immutable")
          PY
          else
            test "$tag_exists" = false
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$TARGET_SHA" -m "Release ${RELEASE_VERSION}"
            git push origin "$tag_ref"
            gh release create "$RELEASE_TAG" \
              --draft \
              --verify-tag \
              --target "$TARGET_SHA" \
              --title "AstrEmbodiment ${RELEASE_VERSION}" \
              --notes-from-tag
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > "$release_json"
          fi
      - name: Verify or upload draft assets without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
          TARGET_SHA: ${{ needs.validate-release.outputs.target_sha }}
          ARCHIVE_NAME: ${{ needs.assemble-release.outputs.archive_name }}
          CHECKSUM_NAME: ${{ needs.assemble-release.outputs.checksum_name }}
        run: |
          set -euo pipefail
          archive="release-assets/${ARCHIVE_NAME}"
          checksum="release-assets/${CHECKSUM_NAME}"
          release_state="$RUNNER_TEMP/release-state.json"
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,targetCommitish,isDraft,isPrerelease,isImmutable,assets \
            > "$release_state"
          mapfile -t missing_assets < <(
            python - "$release_state" "$RELEASE_TAG" "$TARGET_SHA" "$archive" "$checksum" <<'PY'
          import json
          import pathlib
          import sys

          release = json.load(open(sys.argv[1], encoding="utf-8"))
          tag, target, *paths = sys.argv[2:]
          if release.get("tagName") != tag:
              raise SystemExit("release tag does not match the requested tag")
          if release.get("targetCommitish") != target:
              raise SystemExit("release target does not match the requested SHA")
          if release.get("isDraft") is not True:
              raise SystemExit("release must remain a draft until assets are verified")
          if release.get("isPrerelease") is not False:
              raise SystemExit("release has an unexpected prerelease state")
          if release.get("isImmutable") is True:
              raise SystemExit("draft release is unexpectedly immutable")
          assets = {}
          for asset in release.get("assets", []):
              assets.setdefault(asset["name"], []).append(asset)
          for raw_path in paths:
              path = pathlib.Path(raw_path)
              existing = assets.get(path.name, [])
              if len(existing) > 1:
                  raise SystemExit(f"duplicate draft asset: {path.name}")
              if existing:
                  if existing[0].get("size") != path.stat().st_size:
                      raise SystemExit(f"draft asset size mismatch: {path.name}")
              else:
                  print(path)
          PY
          )
          if ((${#missing_assets[@]})); then
            gh release upload "$RELEASE_TAG" "${missing_assets[@]}"
          fi
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,targetCommitish,isDraft,isPrerelease,isImmutable,assets \
            > "$release_state"
          python - "$release_state" "$RELEASE_TAG" "$TARGET_SHA" "$archive" "$checksum" <<'PY'
          import json
          import pathlib
          import sys

          release = json.load(open(sys.argv[1], encoding="utf-8"))
          tag, target, *paths = sys.argv[2:]
          if release.get("tagName") != tag or release.get("targetCommitish") != target:
              raise SystemExit("draft release identity changed while preparing assets")
          if release.get("isDraft") is not True or release.get("isImmutable") is True:
              raise SystemExit("release is not a mutable draft before publish")
          assets = {}
          for asset in release.get("assets", []):
              assets.setdefault(asset["name"], []).append(asset)
          for raw_path in paths:
              path = pathlib.Path(raw_path)
              existing = assets.get(path.name, [])
              if len(existing) != 1 or existing[0].get("size") != path.stat().st_size:
                  raise SystemExit(f"draft asset did not match local size: {path.name}")
          PY
          download_dir="$(mktemp -d "$RUNNER_TEMP/astr-embodiment-release-assets.XXXXXX")"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$download_dir" \
            --pattern "$ARCHIVE_NAME"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$download_dir" \
            --pattern "$CHECKSUM_NAME"
          cmp --silent "$archive" "$download_dir/$ARCHIVE_NAME"
          cmp --silent "$checksum" "$download_dir/$CHECKSUM_NAME"
          (
            cd "$download_dir"
            sha256sum --check "$CHECKSUM_NAME"
          )
      - name: Publish and require release immutability
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
          TARGET_SHA: ${{ needs.validate-release.outputs.target_sha }}
          ARCHIVE_NAME: ${{ needs.assemble-release.outputs.archive_name }}
          CHECKSUM_NAME: ${{ needs.assemble-release.outputs.checksum_name }}
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          release_state="$RUNNER_TEMP/published-release-state.json"
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,targetCommitish,isDraft,isPrerelease,isImmutable,assets,url \
            > "$release_state"
          python - "$release_state" "$RELEASE_TAG" "$TARGET_SHA" "$ARCHIVE_NAME" "$CHECKSUM_NAME" <<'PY'
          import json
          import sys

          release = json.load(open(sys.argv[1], encoding="utf-8"))
          tag, target, archive_name, checksum_name = sys.argv[2:]
          if release.get("tagName") != tag or release.get("targetCommitish") != target:
              raise SystemExit("published release identity does not match the validated target")
          if release.get("isDraft") is not False:
              raise SystemExit("release did not publish")
          if release.get("isPrerelease") is not False:
              raise SystemExit("published release has an unexpected prerelease state")
          if release.get("isImmutable") is not True:
              raise SystemExit("published release is not immutable")
          asset_names = {asset.get("name") for asset in release.get("assets", [])}
          if {archive_name, checksum_name} - asset_names:
              raise SystemExit("published release is missing a verified asset")
          PY

# This dispatch-only workflow publishes GitHub release assets only. Marketplace
# publication is intentionally outside this workflow.
