name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python 格式、静态检查与回归
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装开发依赖
        run: python -m pip install --upgrade pip -r requirements-dev.txt
      - name: 检查 Python 格式
        run: python -m ruff format --check main.py astr_embodiment tests scripts
      - name: 检查 Python 错误
        run: >-
          python -m ruff check --select E,F --ignore E501
          main.py astr_embodiment tests scripts
      - name: 运行 Python 回归
        run: python -m pytest -q --ignore=tests/test_release_contracts.py
      - name: 运行可复现的发布契约测试
        run: >-
          python -m pytest -q tests/test_release_contracts.py
          -k "not fresh and not release_archive_bundles_only_runtime_files"

  rust-quality:
    name: Rust 格式、Clippy 与回归
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: 安装稳定版 Rust 工具链
        run: >-
          rustup toolchain install stable --profile minimal
          --component rustfmt --component clippy
      - name: 选择稳定版 Rust 工具链
        run: rustup default stable
      - name: 检查 Rust 格式
        run: cargo fmt --all -- --check
      - name: 检查 Rust lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: 运行 Rust 回归
        env:
          AE_RC1_TASK_TEMP: ${{ runner.temp }}
          CODEX_TASK_TEMP: ${{ runner.temp }}
        run: cargo test --workspace --locked

  release-contract:
    name: 发布版本契约
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: 验证版本和锁文件
        run: python scripts/verify_release_contract.py

  native-wheel:
    name: 原生 wheel (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            runner: windows-2022
            artifact: native-wheel-windows
          - name: linux
            runner: ubuntu-22.04
            artifact: native-wheel-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装稳定版 Rust 工具链
        run: rustup toolchain install stable --profile minimal
      - name: 选择稳定版 Rust 工具链
        run: rustup default stable
      - name: 安装打包工具
        run: python -m pip install --upgrade pip maturin==1.14.1 "pytest>=8,<10"
      - name: 构建原生 wheel
        run: python -m maturin build --release --out dist
      - name: 保存原生 wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7
      - name: 冒烟导入原生 wheel
        run: >-
          python -c "import pathlib, subprocess, sys; wheels=sorted(pathlib.Path('dist').glob('*.whl')); assert len(wheels) == 1, wheels; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', str(wheels[0])]); import astrembodiment_core as core; assert core.version() == '1.0.0-rc2'; print(core.version())"
      - name: 冒烟导入完整插件 bundle
        env:
          AE_FRESH_NATIVE_WHEEL_DIR: ${{ github.workspace }}/dist
        run: >-
          python -m pytest -q tests/test_release_contracts.py
          -k "fresh_archive_imports_native_api_in_clean_astrbot_namespace"
