name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python format, lint, and tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt
      - name: Check Python formatting
        run: python -m ruff format --check main.py astr_embodiment tests scripts
      - name: Check Python lint
        run: >-
          python -m ruff check --select E,F --ignore E501
          main.py astr_embodiment tests scripts
      - name: Run Python regressions
        run: python -m pytest -q --ignore=tests/test_release_contracts.py

  rust-quality:
    name: Rust format, Clippy, and tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check Rust lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run Rust regressions
        env:
          CODEX_TASK_TEMP: ${{ runner.temp }}
        run: cargo test --workspace --locked

  release-contract:
    name: Production version and changelog contract
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify production version contract
        run: python scripts/verify_release_contract.py --tag v1.0.0
      - name: Run static release tests
        run: python -m pytest -q tests/test_production_release_contract.py

  native-package:
    name: Package matrix (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2022
            artifact: native-wheel-windows
          - name: Linux x86_64
            runner: ubuntu-22.04
            artifact: native-wheel-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install stable Rust and packaging tools
        run: >-
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy;
          rustup default stable;
          python -m pip install --upgrade pip maturin==1.14.1 "pytest>=8,<10" "ruff>=0.12,<1"
      - name: Check Python formatting and lint
        run: >-
          python -m ruff format --check main.py astr_embodiment tests scripts;
          python -m ruff check --select E,F --ignore E501 main.py astr_embodiment tests scripts
      - name: Run Python regressions
        run: python -m pytest -q --ignore=tests/test_release_contracts.py
      - name: Check Rust formatting and lint
        run: >-
          cargo fmt --all -- --check;
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run Rust regressions
        env:
          CODEX_TASK_TEMP: ${{ runner.temp }}
        run: cargo test --workspace --locked
      - name: Build native wheel
        run: python -m maturin build --release --out dist
      - name: Smoke-test current native wheel
        run: >-
          python -c "import pathlib, subprocess, sys; wheels=sorted(pathlib.Path('dist').glob('*.whl')); assert len(wheels) == 1, wheels; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', str(wheels[0])]); import astrembodiment_core as core; assert core.version() == '1.0.0'; print(core.version())"
      - name: Save native wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  assemble-allowlisted-zip:
    name: Assemble allowlisted ZIP and SHA256
    needs: native-package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-wheel-*
          path: wheels
      - name: Assemble allowlisted ZIP
        run: >-
          python scripts/package_plugin.py
          --output dist/astrbot_plugin_astrembodiment-v1.0.0-win_linux_x86_64.zip
          --sha256-output dist/astrbot_plugin_astrembodiment-v1.0.0-win_linux_x86_64.zip.sha256
          --native-wheel wheels/native-wheel-windows/*.whl
          --native-wheel wheels/native-wheel-linux/*.whl
      - name: Verify allowlisted ZIP and SHA256
        run: >-
          cd dist && sha256sum --check
          astrbot_plugin_astrembodiment-v1.0.0-win_linux_x86_64.zip.sha256
      - name: Save release-candidate assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: astrbot-plugin-1.0.0-release-candidate
          path: dist/astrbot_plugin_astrembodiment-v1.0.0-win_linux_x86_64.zip*
          if-no-files-found: error
          retention-days: 14
