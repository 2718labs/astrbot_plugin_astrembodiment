name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Feature branches run through pull_request only; the matching master push
  # is the post-merge verification, so a pull request never receives both.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python format and lint
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt
      - name: Check Python formatting
        run: python -m ruff format --check scripts/package_plugin.py scripts/verify_release_contract.py scripts/verify_release_archive.py scripts/stage_native_runtime.py tests/test_release_contracts.py tests/test_production_release_contract.py tests/test_release_workflow_pipeline.py tests/test_release_archive_verifier.py tests/test_stage_native_runtime.py
      - name: Check Python lint
        run: >-
          python -m ruff check --select E,F --ignore E501
          main.py astr_embodiment tests scripts
  rust-quality:
    name: Rust format, Clippy, and tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Check Rust formatting
        # Explicit integration scope; legacy module formatting is not rewritten.
        run: >-
          rustfmt --edition 2021 --config skip_children=true --check
          crates/ae-contracts/src/alpha3.rs
          crates/ae-contracts/src/embodiment_time.rs
          crates/ae-contracts/src/emotion_matrix.rs
          crates/ae-platform-fs/src/lib.rs
          crates/ae-pyo3/src/lib.rs
          crates/ae-renorm/src/lib.rs
          crates/ae-runtime/src/lib.rs
          crates/ae-store/src/alpha3/ecosystem.rs
          crates/ae-store/src/alpha3/interaction.rs
          crates/ae-store/src/alpha3/lived_world.rs
          crates/ae-store/src/alpha3/projection.rs
          crates/ae-store/src/autonomy.rs
          crates/ae-store/src/core_boundary_v9.rs
          crates/ae-store/src/core_ingress.rs
          crates/ae-store/src/embodiment_clock.rs
          crates/ae-store/src/lib.rs
          crates/ae-store/src/semantic.rs
          crates/ae-store/src/semantic_field_attestation.rs
          crates/ae-store/tests/core_boundary_v9.rs
      - name: Check Rust lint
        run: cargo clippy --workspace --lib --bins --locked -- -D warnings
      - name: Check production Rust workspace
        run: cargo check --workspace --lib --bins --locked

  release-contract:
    name: Production version and changelog contract
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install release test dependencies
        run: python -m pip install --upgrade pip "pytest>=8,<10"
      - name: Derive and verify production release identifiers
        shell: bash
        run: |
          set -euo pipefail
          release_version="$(python scripts/verify_release_contract.py --field version)"
          release_tag="$(python scripts/verify_release_contract.py --field tag)"
          python scripts/verify_release_contract.py \
            --tag "$release_tag" --version "$release_version"
      - name: Run static release tests
        run: python -m pytest -q tests/test_production_release_contract.py tests/test_release_workflow_pipeline.py tests/test_release_archive_verifier.py

  native-package:
    name: Package matrix (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2022
            artifact: native-wheel-windows
          - name: Linux x86_64
            runner: ubuntu-22.04
            artifact: native-wheel-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install stable Rust and packaging tools
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          python -m pip install --upgrade pip maturin==1.14.1 "pytest>=8,<10" "ruff>=0.12,<1"
      - name: Build native wheel from the selected SHA
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            python -m pip install ziglang==0.13.0
            python scripts/package_plugin.py --build-native --source-sha "$SOURCE_SHA" --output "$RUNNER_TEMP/native-wheels" --target x86_64-unknown-linux-gnu --compatibility manylinux_2_17 --zig
          else
            python scripts/package_plugin.py --build-native --source-sha "$SOURCE_SHA" --output "$RUNNER_TEMP/native-wheels" --target x86_64-pc-windows-msvc
          fi
      - name: Import the exact wheel on its actual platform
        shell: bash
        run: |
          set -euo pipefail
          python scripts/package_plugin.py --verify-wheel "$RUNNER_TEMP"/native-wheels/*.whl --output "$RUNNER_TEMP/native-wheels/import-receipt.json"
      - name: Resolve production version from metadata
        id: release-identifiers
        shell: bash
        run: |
          set -euo pipefail
          release_version="$(python scripts/verify_release_contract.py --field version)"
          release_tag="$(python scripts/verify_release_contract.py --field tag)"
          python scripts/verify_release_contract.py --tag "$release_tag" --version "$release_version"
          printf 'release_version=%s\n' "$release_version" >> "$GITHUB_OUTPUT"
      - name: Save native wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/native-wheels/*
          if-no-files-found: error
          retention-days: 7
      - name: Check Python formatting and lint
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff format --check scripts/package_plugin.py scripts/verify_release_contract.py scripts/verify_release_archive.py scripts/stage_native_runtime.py tests/test_release_contracts.py tests/test_production_release_contract.py tests/test_release_workflow_pipeline.py tests/test_release_archive_verifier.py tests/test_stage_native_runtime.py
          python -m ruff check --select E,F --ignore E501 main.py astr_embodiment tests scripts
      - name: Install the verified native wheel for regressions
        shell: bash
        run: python -m pip install "$RUNNER_TEMP"/native-wheels/*.whl
      - name: Run Python regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_host_master_integration.py tests/test_semantic_appraisal_core.py tests/test_ordinary_reply_flow.py tests/test_embodiment_clock.py tests/test_core_boundary_surface.py
          python -m pytest -q tests/test_runtime_integration.py -k 'assistant_provider or persona_resolution or seed_is_saved or seed_persistence or request_injection or fixed_runtime_values or seed_command_echoes or native_bridge_finds or native_bridge_error or schema_exposes or runtime_commands'
          python -m pytest -q tests/test_auxiliary_transport.py -k 'not transient_semantic_failure and not semantic_owner'
          python scripts/validate_kit.py
          python scripts/scan_core_boundary.py
      - name: Run Rust regressions (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CI_TASK_ROOT_PARENT: ${{ runner.temp }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CI_TASK_ROOT_PARENT)) {
            throw "runner.temp must be set for Rust regressions."
          }
          $taskTemp = Join-Path -Path $env:CI_TASK_ROOT_PARENT -ChildPath "ae-card-r-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.artifact }}"
          New-Item -ItemType Directory -Path $taskTemp -Force | Out-Null
          $env:CODEX_TASK_TEMP = $taskTemp
          $env:AE_CARD_R_TEMP_ROOT = $taskTemp
          $env:AE_RC1_TASK_TEMP = $taskTemp
          $env:CARGO_TARGET_DIR = Join-Path -Path $taskTemp -ChildPath "target"
          New-Item -ItemType Directory -Path $env:CARGO_TARGET_DIR -Force | Out-Null
          cargo test -p ae-runtime --test core_boundary_runtime --test core_matrix_regression --test phase0_native_semantic --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p ae-store --test core_boundary_v9 --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p ae-store --test legacy_semantic_upgrade_schema --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p ae-semantic-core --test matrix_time --test user_stimulus_transition --test affect_projection --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p ae-neurofield --test graph_persistence_replay --test structural_delta_cas --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Rust regressions (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          CI_TASK_ROOT_PARENT: ${{ runner.temp }}
        run: |
          set -euo pipefail
          : "${CI_TASK_ROOT_PARENT:?runner.temp must be set for Rust regressions}"
          task_temp="${CI_TASK_ROOT_PARENT}/ae-card-r-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.artifact }}"
          mkdir -p -- "$task_temp"
          export CODEX_TASK_TEMP="$task_temp"
          export AE_CARD_R_TEMP_ROOT="$task_temp"
          export AE_RC1_TASK_TEMP="$task_temp"
          export CARGO_TARGET_DIR="$task_temp/target"
          mkdir -p -- "$CARGO_TARGET_DIR"
          cargo test -p ae-runtime --test core_boundary_runtime --test core_matrix_regression --test phase0_native_semantic --locked
          cargo test -p ae-store --test core_boundary_v9 --locked
          cargo test -p ae-store --test legacy_semantic_upgrade_schema --locked
          cargo test -p ae-semantic-core --test matrix_time --test user_stimulus_transition --test affect_projection --locked
          cargo test -p ae-neurofield --test graph_persistence_replay --test structural_delta_cas --locked

  assemble-allowlisted-zip:
    name: Assemble allowlisted ZIP and SHA256
    needs: native-package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install release package test dependencies
        run: python -m pip install --upgrade pip "pytest>=8,<10"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-wheel-*
          path: ${{ runner.temp }}/native-inputs
      - name: Resolve metadata-derived release asset names
        id: release-identifiers
        shell: bash
        run: |
          set -euo pipefail
          release_version="$(python scripts/verify_release_contract.py --field version)"
          release_tag="$(python scripts/verify_release_contract.py --field tag)"
          python scripts/verify_release_contract.py \
            --tag "$release_tag" --version "$release_version"
          archive_name="astrbot_plugin_astrembodiment-v${release_version}-win_linux_x86_64.zip"
          printf 'release_version=%s\n' "$release_version" >> "$GITHUB_OUTPUT"
          printf 'archive_name=%s\n' "$archive_name" >> "$GITHUB_OUTPUT"
          printf 'checksum_name=%s\n' "${archive_name}.sha256" >> "$GITHUB_OUTPUT"
      - name: Assemble allowlisted ZIP
        env:
          ARCHIVE_NAME: ${{ steps.release-identifiers.outputs.archive_name }}
          CHECKSUM_NAME: ${{ steps.release-identifiers.outputs.checksum_name }}
        run: |
          set -euo pipefail
          python scripts/package_plugin.py --source-sha "$GITHUB_SHA" \
            --output "dist/${ARCHIVE_NAME}" \
            --native-wheel "$RUNNER_TEMP"/native-inputs/native-wheel-windows/*.whl \
            --native-wheel "$RUNNER_TEMP"/native-inputs/native-wheel-linux/*.whl \
            --import-receipt "$RUNNER_TEMP/native-inputs/native-wheel-windows/import-receipt.json" \
            --import-receipt "$RUNNER_TEMP/native-inputs/native-wheel-linux/import-receipt.json"
          (cd dist && sha256sum "$ARCHIVE_NAME" > "$CHECKSUM_NAME")
      - name: Run allowlisted ZIP package contract
        env:
          ARCHIVE_NAME: ${{ steps.release-identifiers.outputs.archive_name }}
        shell: bash
        run: |
          set -euo pipefail
          windows_wheels=("$RUNNER_TEMP"/native-inputs/native-wheel-windows/*.whl)
          linux_wheels=("$RUNNER_TEMP"/native-inputs/native-wheel-linux/*.whl)
          export AE_FRESH_WINDOWS_WHEEL="${windows_wheels[0]}"
          export AE_FRESH_LINUX_WHEEL="${linux_wheels[0]}"
          export AE_RELEASE_ARCHIVE="$GITHUB_WORKSPACE/dist/$ARCHIVE_NAME"
          python -m pytest -q tests/test_release_contracts.py
      - name: Verify allowlisted ZIP and SHA256
        env:
          CHECKSUM_NAME: ${{ steps.release-identifiers.outputs.checksum_name }}
        run: cd dist && sha256sum --check "$CHECKSUM_NAME"
      - name: Save release-candidate assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: astrbot-plugin-${{ steps.release-identifiers.outputs.release_version }}-release-candidate
          path: dist/${{ steps.release-identifiers.outputs.archive_name }}*
          if-no-files-found: error
          retention-days: 14

  verify-archive:
    name: Verify exact ZIP (${{ matrix.runner }})
    needs: assemble-allowlisted-zip
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: astrbot-plugin-*-release-candidate
          merge-multiple: true
          path: ${{ runner.temp }}/archive-input
      - name: Verify packaged identity, database lifecycle and preservation
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python scripts/verify_release_archive.py --archive "$RUNNER_TEMP"/archive-input/*.zip --source-sha "$SOURCE_SHA" --work-dir "$RUNNER_TEMP" --receipt "$RUNNER_TEMP/archive-receipt.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: archive-receipt-${{ matrix.runner }}
          path: ${{ runner.temp }}/archive-receipt.json
          if-no-files-found: error
          retention-days: 14
